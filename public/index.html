<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard · ShortForm Manager</title>
  <link rel="stylesheet" href="/assets/base.css" />
</head>
<body>
  <div class="shell">
    <aside id="sidebar"></aside>
    <div class="main">
      <header id="topbar"></header>
      <main class="content page-fade">

        <div class="grid grid-4 mb-24" id="stat-tiles">
          <div class="stat"><div class="skeleton" style="height:52px"></div></div>
          <div class="stat"><div class="skeleton" style="height:52px"></div></div>
          <div class="stat"><div class="skeleton" style="height:52px"></div></div>
          <div class="stat"><div class="skeleton" style="height:52px"></div></div>
        </div>

        <div class="grid grid-2">
          <div class="card">
            <div class="card-title">Next publishes <span class="hint" id="queue-hint"></span></div>
            <div id="next-publishes"><div class="skeleton" style="height:120px"></div></div>
          </div>
          <div class="card">
            <div class="card-title">Recent activity</div>
            <div id="recent-activity"><div class="skeleton" style="height:120px"></div></div>
          </div>
        </div>

        <div class="card mt-16">
          <div class="card-title">Platform connections</div>
          <div id="platform-summary" class="flex" style="flex-wrap:wrap; gap:10px">
            <div class="skeleton" style="height:28px;width:340px"></div>
          </div>
        </div>

      </main>
    </div>
  </div>
  <script type="module" src="/assets/dashboard.js"></script>
</body>
</html>
