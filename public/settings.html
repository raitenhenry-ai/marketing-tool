<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Settings · Clint</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon-512.png">
  <script>document.documentElement.dataset.theme = localStorage.getItem("theme") || "light";</script>
  <link rel="stylesheet" href="assets/base.css" />
</head>
<body>
  <div class="shell">
    <aside id="sidebar"></aside>
    <div class="main">
      <header id="topbar"></header>
      <main class="content page-fade">
        <div class="callout info mb-16" id="settings-note">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
          <span>Settings are configured through environment variables (<code>.env</code> locally,
          or your host's Variables panel) and applied on restart. This page shows what's active right now.</span>
        </div>
        <div id="settings-host">
          <div class="card"><div class="skeleton" style="height:180px"></div></div>
        </div>
      </main>
    </div>
  </div>
  <script type="module" src="assets/settings.js"></script>
</body>
</html>
