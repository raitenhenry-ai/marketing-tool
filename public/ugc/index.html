<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard · UGC Studio</title>
  <script>document.documentElement.dataset.theme = localStorage.getItem("ugc-theme") || "light";</script>
  <link rel="stylesheet" href="ugc.css" />
</head>
<body>
  <div class="shell">
    <aside id="sidebar"></aside>
    <div class="main">
      <header id="topbar"></header>

      <div class="layout">
        <main class="content">

          <div class="stats" id="stat-tiles">
            <div class="stat"><div class="stat-head"><span class="stat-ico dark" data-ico="tiktok"></span> Videos Created</div><div class="stat-value">—</div></div>
            <div class="stat"><div class="stat-head"><span class="stat-ico purple" data-ico="send"></span> Posts Published</div><div class="stat-value">—</div></div>
            <div class="stat"><div class="stat-head"><span class="stat-ico blue" data-ico="users"></span> Connected Accounts</div><div class="stat-value">—</div></div>
            <div class="stat"><div class="stat-head"><span class="stat-ico green" data-ico="check"></span> Success Rate</div><div class="stat-value">—</div></div>
          </div>

          <section class="card" id="styles">
            <div class="card-head">
              <div>
                <div class="card-title">Trending Video Styles</div>
                <div class="card-sub">What's performing best right now</div>
              </div>
              <div class="tabs">
                <button class="tab on">TikTok</button>
                <button class="tab">Instagram</button>
              </div>
            </div>
            <div class="styles-row" id="styles-row"></div>
          </section>

          <section class="card" id="recent">
            <div class="card-head">
              <div>
                <div class="card-title">Recent Content</div>
                <div class="card-sub" id="jobs-hint"></div>
              </div>
              <a class="view-all" href="content.html">View all</a>
            </div>
            <div class="jobs-row" id="jobs">
              <div class="empty">Loading…</div>
            </div>
          </section>

        </main>

        <aside class="rail">
          <section class="card">
            <div class="card-head">
              <div class="card-title">Analytics Overview</div>
              <a class="view-all" href="analytics.html">View all</a>
            </div>
            <div id="platform-overview"><div class="empty small">Loading…</div></div>
          </section>

          <section class="card">
            <div class="card-head">
              <div class="card-title">Top Performing Content</div>
              <a class="view-all" href="analytics.html">View all</a>
            </div>
            <div id="top-content"><div class="empty small">Nothing posted yet</div></div>
          </section>
        </aside>
      </div>
    </div>
  </div>

  <script type="module" src="dashboard.js"></script>
</body>
</html>
