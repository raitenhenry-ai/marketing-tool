<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Video · ShortForm Manager</title>
  <script>document.documentElement.dataset.theme = localStorage.getItem("theme") || "light";</script>
  <link rel="stylesheet" href="/assets/base.css" />
</head>
<body>
  <div class="shell">
    <aside id="sidebar"></aside>
    <div class="main">
      <header id="topbar"></header>
      <main class="content page-fade">
        <div id="video-head" class="card mb-16">
          <div class="skeleton" style="height:64px"></div>
        </div>
        <div id="clips-host">
          <div class="clip-grid">
            <div class="clip-card"><div class="skeleton" style="height:260px;border-radius:0"></div></div>
            <div class="clip-card"><div class="skeleton" style="height:260px;border-radius:0"></div></div>
            <div class="clip-card"><div class="skeleton" style="height:260px;border-radius:0"></div></div>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script type="module" src="/assets/video.js"></script>
</body>
</html>
